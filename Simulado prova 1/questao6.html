<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmes</title>
</head>
<body>
    <h1>Lista de filmes do diretor Christopher Nolan</h1>
    <div id="filmes-nolan"></div>
  <script>
        
        function loadXMLDoc() {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "filmes.xml", true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    const xmlDoc = xhr.responseXML;
                    const filmes = xmlDoc.getElementsByTagName("filme");
                    const ul = document.createElement("ul");
                    for (let i = 0; i < filmes.length; i++) {
                        const diretor = filmes[i].getElementsByTagName("diretor")[0].textContent;
                        if (diretor === "Christopher Nolan") {
                            const li = document.createElement("li");
                            li.textContent = filmes[i].getElementsByTagName("titulo")[0].textContent;
                            ul.appendChild(li);
                        }
                    }
                    document.getElementById("filmes-nolan").appendChild(ul);
                }
            };
            xhr.send();
        }
    window.onload = loadXMLDoc;
  </script>
</body>
</html>
