<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmes</title>
</head>
<body>
    <h1>Acessando o segundo elemento da lista de filmes</h1>
    <div id="filme-especifico"></div>
  <script>
        function loadXMLDoc() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "filmes.xml", true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                const xmlDoc = xhr.responseXML;
                const filmes = xmlDoc.getElementsByTagName("filme");
                const segundoFilme = filmes[1];
                const id = segundoFilme.getAttribute("id");
                const titulo = segundoFilme.getElementsByTagName("titulo")[0].textContent;
                const ano = segundoFilme.getElementsByTagName("ano")[0].textContent;
                const div = document.getElementById("filme-especifico");
                div.innerHTML = `ID: ${id} <br> Título: ${titulo} <br> Ano: ${ano}`;
            }
        };
        xhr.send();
    }
    window.onload = loadXMLDoc;
  </script>
</body>
</html>
