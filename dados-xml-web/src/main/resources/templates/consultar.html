<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title>Consulta e Exclusão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h1>Consulta de Dados</h1>
  <nav class="mb-3">
    <a href="/upload" class="btn btn-outline-primary btn-sm">Upload XML</a>
    <a href="/produtos/novo" class="btn btn-success btn-sm">Novo Produto</a>
    <a href="/clientes/novo" class="btn btn-success btn-sm">Novo Cliente</a>
  </nav>

  <h2>Produtos</h2>
  <table class="table table-striped">
    <thead><tr>
      <th>ID</th><th>Nome</th><th>Preço</th><th>Categoria</th><th>Estoque</th><th>Ações</th>
    </tr></thead>
    <tbody>
    <tr th:each="p : ${produtos}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.nome}"></td>
      <td th:text="${p.preco}"></td>
      <td th:text="${p.categoria}"></td>
      <td th:text="${p.estoque}"></td>
      <td>
        <a th:href="@{|/produtos/${p.id}/editar|}" class="btn btn-warning btn-sm">Editar</a>
        <form th:action="@{|/produtos/${p.id}/delete|}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-danger btn-sm"
                  onclick="return confirm('Confirmar exclusão?')">Excluir</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <h2>Clientes</h2>
  <table class="table table-striped">
    <thead><tr>
      <th>ID</th><th>Nome</th><th>Email</th><th>Endereço</th><th>Telefone</th><th>Ações</th>
    </tr></thead>
    <tbody>
    <tr th:each="c : ${clientes}">
      <td th:text="${c.id}"></td>
      <td th:text="${c.nome}"></td>
      <td th:text="${c.email}"></td>
      <td th:text="${c.endereco}"></td>
      <td th:text="${c.telefone}"></td>
      <td>
        <a th:href="@{|/clientes/${c.id}/editar|}" class="btn btn-warning btn-sm">Editar</a>
        <form th:action="@{|/clientes/${c.id}/delete|}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-danger btn-sm"
                  onclick="return confirm('Confirmar exclusão?')">Excluir</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
