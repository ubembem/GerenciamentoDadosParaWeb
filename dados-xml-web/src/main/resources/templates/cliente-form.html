<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${acao} + ' Cliente'">Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h1 th:text="${acao} + ' Cliente'"></h1>

  <form th:action="@{${#httpServletRequest.requestURI}}" method="post" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" name="nome" th:value="${cliente.nome}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" th:value="${cliente.email}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Endereço</label>
      <textarea name="endereco" th:text="${cliente.endereco}" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Telefone</label>
      <input type="text" name="telefone" th:value="${cliente.telefone}" class="form-control" required/>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="/consultar-dados" class="btn btn-secondary">Voltar</a>
  </form>
</div>
</body>
</html>
