<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title>Upload XML</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container container-loja">
  <h1 class="mb-4">Upload de XML</h1>

  <form th:action="@{/upload}" method="post" enctype="multipart/form-data" class="mb-3">
    <div class="mb-3">
      <label for="file" class="form-label">Selecione o arquivo XML</label>
      <input type="file" id="file" name="file" accept=".xml" class="form-control" required/>
    </div>
    <button type="submit" class="btn btn-primary">Enviar</button>
  </form>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

  <div th:if="${linkConsulta}">
    <a th:href="${linkConsulta}" class="btn btn-outline-secondary">Ir para Consulta de Dados</a>
  </div>
</div>
</body>
</html>
