<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${acao} + ' Produto'">Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h1 th:text="${acao} + ' Produto'"></h1>
  <form th:action="@{${#httpServletRequest.requestURI}}" method="post" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" name="nome" th:value="${produto.nome}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Descrição</label>
      <textarea name="descricao" th:text="${produto.descricao}" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Preço</label>
      <input type="number" step="0.01" name="preco" th:value="${produto.preco}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Categoria</label>
      <input type="text" name="categoria" th:value="${produto.categoria}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Estoque</label>
      <input type="number" name="estoque" th:value="${produto.estoque}" class="form-control" required/>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="/consultar-dados" class="btn btn-secondary">Voltar</a>
  </form>
</div>
</body>
</html>
